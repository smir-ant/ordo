cargo-features = ["profile-rustflags", "trim-paths"]

[package]
name = "ordo"
version = "0.1.0"
edition = "2024"

[package.metadata.bundle]
name = "Ordo"
identifier = "com.smirant.ordo"
icon = ["icon/AppIcon.icns"]
version = "0.1.0"
copyright = "Copyright (c) 2026 smir-ant"
category = "Productivity"
short_description = "A productivity application"
long_description = "A productivity application built with Makepad"

[profile.dev]
incremental = true # Compile your binary in smaller steps.
rustflags = ["-Zthreads=8"] # Better compile performance.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = "fat" # Enables full link-time-optimizations.
opt-level = "z" # Prioritizes small binary size.
panic = "abort" # Higher performance by disabling panic handlers.
strip = true # Ensures debug symbols are removed.
trim-paths = "all" # Removes potentially privileged information from your binaries.
rustflags = ["-Cdebuginfo=0", "-Zthreads=8"] # Better compile performance.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
makepad-widgets = { path = "makepad/widgets" }
time = { version = "0.3", features = ["local-offset"] }
lewton = "0.10"